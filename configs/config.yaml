project:
  name: "IMDB Sentiment Classification"
  seed: 42

data:
  train_size: 20000
  validation_size: 5000
  test_size: 25000

  max_length: 500
  batch_size: 8

training:
  epochs: 3

  distilbert:
    learning_rate: 0.00001
    weight_decay: 0.01

models:
  simple_rnn:
    name: "Simple RNN"

  lstm:
    name: "LSTM"

  bilstm:
    name: "BiLSTM"

  transformer:
    name: "Transformer Encoder"

  distilbert:
    name: "DistilBERT"
    pretrained_name: "distilbert/distilbert-base-uncased"

paths:
  model_dir: "models"
  results_dir: "results"